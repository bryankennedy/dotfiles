# herdr configuration — stowed from ~/src/dotfiles/herdr/.config/herdr/config.toml
# Reload without restart:  herdr server reload-config

# Skip the first-run onboarding prompt.
onboarding = false

[theme]
# Active. Dark all the time, matching Ghostty's pinned `theme = Catppuccin
# Macchiato`, regardless of the macOS system appearance.
name = "catppuccin"
auto_switch = false

# Track Ghostty, which itself follows the macOS system appearance
# (light:ghostty-tokyonight-day, dark:Catppuccin Macchiato). herdr detects light
# vs dark by asking the terminal for its background color over OSC 11, so it
# swaps with Ghostty rather than needing its own macOS hook. Keep these two names
# in step with Ghostty's `theme` line. `name` is the fallback used only if
# auto_switch is off or the terminal never answers the query. To go back,
# uncomment these four lines and comment out the two above.
# name = "tokyo-night-day"
# auto_switch = true
# dark_name = "catppuccin"
# light_name = "tokyo-night-day"

[terminal]
# Empty => $SHELL (zsh). "auto" uses a login shell on macOS.
default_shell = ""
shell_mode = "auto"
# New panes inherit the source pane/workspace directory.
new_cwd = "follow"

[keys]
# ctrl+a, inherited from the tmux setup herdr replaced — Ghostty now launches
# herdr directly, so nothing else wants this chord. It drives every saved SSH
# machine too: the client applies local keybindings to whichever machine is
# selected. The VMs' own prefix (ctrl+b, herdr_prefix in the ansible inventory)
# only matters when a remote is driven outside the catalog — `herdr --remote
# … --remote-keybindings server`, or `herdr` after SSHing in — and it stays
# different from this one so a remote client nested in a local pane can never
# have its keys swallowed by the outer client. See docs/herdr-fleet.md.
prefix = "ctrl+a"

# Run lazygit in a temporary pane.
[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[ui]
# Show which agent is in each pane on the border — useful when juggling many.
show_agent_labels_on_pane_borders = true
accent = "cyan"

[ui.sidebar.spaces]
row_gap = 1

[ui.toast]
# Surface "agent needs attention / finished" as macOS notifications so an idle
# agent can't sit forgotten.
delivery = "system"
delay_seconds = 1

[ui.sound]
# Audible ping when a background agent changes state.
enabled = true

[ui.sound.agents]
claude = "on"
droid = "off"

[session]
# After a herdr server restart, resume agent panes back into their sessions.
resume_agents_on_restore = true

[worktrees]
# Where herdr's "New worktree" action checks out grouped worktree workspaces —
# the mechanism for running a second agent in this repo without file collisions.
# Checkouts land at <directory>/<repo>/<branch-slug>. These are ephemeral, untracked
# checkouts, so keep them out of ~/src and under a dotpath alongside herdr's own
# runtime data. This matches herdr's default; stated explicitly so the layout is
# reproducible across machines and immune to a default change. herdr's own delete
# action leaves the branch behind and skips PR checks — use the cleanup-worktree
# command for post-merge teardown. See docs/herdr-fleet.md.
directory = "~/.herdr/worktrees"

[remote]
# Layer keepalives on top of ~/.ssh/config and reuse one authenticated
# connection per attach — helps `herdr --remote` survive idle drops.
manage_ssh_config = true

[update]
# preview: herdr's pre-release channel — the reason the Mac install moved from
# Homebrew to a direct ~/.local/bin binary (nix-darwin/flake.nix); Homebrew
# installs are refused this channel. The fleet's saved SSH machines (`herdr
# machine list`, kept in step with the ansible inventory by `hf`) only exist on
# preview, and the VMs follow the same channel: herdr_channel and herdr_version
# in the ansible inventory pin every VM to a preview build. Preview builds bump
# the wire protocol ahead of stable, so after `herdr update` here the saved
# machines show Attention until the fleet pin is moved to the same build
# (`make herdr-pin`, then `make herdr` — see docs/herdr-fleet.md).
# `herdr channel set <stable|preview>` rewrites this key in place (through the
# stow symlink, so it edits the repo).
channel = "preview"
