name: argus-verdict

# Argus, the Claude PR reviewer, entirely on this forge. Each run reviews one
# PR head and posts one review as the `argus` account. The review body ends
# with one argus-verdict marker bound to that head (INFRA-289). The review
# gate reads only that marker. This job's own status is only for people to
# look at, and no merge reads it.
#
# bkennedy/infrastructure is the canonical home of this file. There,
# tests/invariants/forgejo-ci.test.js holds the security properties below in
# place: the trigger, the credential-free checkouts, which step sees which
# secret, and the restricted Claude invocation. scripts/forgejo-review-sync.mjs
# there keeps every other repository's copy identical to canonical, apart
# from doc-pointer comment lines, and a nightly check flags drift. Change
# this file in infrastructure, then sync it out.

on:
  # pull_request_target, never pull_request. This workflow holds secrets, and
  # on pull_request a branch runs ITS OWN copy of this file, so a PR could
  # rewrite it and read the tokens. pull_request_target runs the copy on the
  # base branch. The PR's content is only ever read, never executed.
  #
  # Every push gets a new review (synchronize, owner decision C15). An edit
  # of the title or description gets one too, because the marker binds the
  # PR text. Never `labeled`: a label must not create or change a run on a
  # head. To ask for a new review, push a commit, or close and reopen the PR.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

# One queue per PR. A push cancels the runs for older heads, which the gate
# ignores anyway. Every other event queues behind the run in progress and
# never cancels it, so an edit cannot throw away the review of a head.
# Forgejo spells the push event's action "synchronized" in the payload.
concurrency:
  group: argus-verdict-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronized' || github.event.action == 'synchronize' }}

jobs:
  # The job id is the check name: "argus-verdict / claude". There is no `if:`
  # on purpose. Forgejo maps a skipped job to success, so a skip would turn
  # the check green on a head nobody reviewed. A draft, an edit by the gate,
  # or any other event without a review fails in the "Decide" step instead.
  claude:
    runs-on: docker
    container:
      image: node:22-trixie@sha256:77d0c7953e80648137a237496c8edbcb3a14bedc5c5298b93a6d0dfa6c3e1271
    timeout-minutes: 15
    steps:
      # Where the time goes. Each run step appends "<phase> <epoch>" when a
      # phase ends; the post step turns the marks into the review footer and a
      # "timing:" log line (INFRA-185). The file lives outside the workspace
      # because the checkouts below clean it.
      - name: Start the clock
        run: echo "start $(date +%s)" >> "${RUNNER_TEMP:-/tmp}/argus-verdict-timings"

      # Trusted half: the base branch. The prompt, the review criteria
      # (CLAUDE.md) and the posting script all come from here, so a PR cannot
      # rewrite the rules it is reviewed against.
      - name: Check out the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Untrusted half: the PR head, read as data. No credential is left in
      # pr/.git for anything to find.
      - name: Check out the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Mark the end of the checkouts
        run: echo "checkout $(date +%s)" >> "${RUNNER_TEMP:-/tmp}/argus-verdict-timings"

      # Claude Code, one ~220 MB native binary, comes from the runner's cache
      # instead of the registry on every run: the install was the whole
      # one-minute floor of a review (INFRA-185). The key is the digest of the
      # install script, so bumping a pin starts a fresh entry.
      #
      # This job holds secrets, and what keeps a forged entry out of it is the
      # runner, not a digest check. The runner tags every cache write from a
      # pull_request run with an isolation key (refs/pull/<n>/head) that a
      # workflow cannot set, and this job, on pull_request_target, reads only
      # entries written without one: a PR's copy of a pull_request workflow
      # (test.yml, where a repository has one) can save this key and the
      # review never sees it.
      # The digest check in install-tools.sh catches a corrupt entry; it would
      # not contain a forged one, since a restore unpacks a tar archive that
      # can write anywhere in the container. The owner accepted the cache on
      # that footing (RNQ-32, MSPT-102).
      - name: Restore the review toolchain
        id: tools
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/claude-code
          key: review-tools-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      # bun's release zip, as fetch() left it in DOWNLOAD_CACHE_DIR (INFRA-192).
      # Same barrier as the Claude binary above, the runner's write isolation;
      # fetch() checks a restored file against BUN_SHA256 all the same, which
      # catches a corrupt one. Its own key, apart from any test.yml's, so
      # neither workflow's first save claims an entry the other then never
      # fills.
      - name: Restore the toolchain downloads
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cache/ci-downloads
          key: ci-downloads-review-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      - name: Install the pinned toolchain
        run: |
          sh .forgejo/ci/install-tools.sh review
          echo "install $(date +%s)" >> "${RUNNER_TEMP:-/tmp}/argus-verdict-timings"

      # The skip decision, as a failure. A draft (a WIP: or [WIP] title, the
      # gate's escalation prefix ignored), an edit by the gate account, a
      # closed PR, or any other event exits 1 here with "no verdict: <why>".
      # Nothing later runs, and nothing is posted.
      - name: Decide whether this event gets a review
        run: bun scripts/forgejo-review.mjs decide

      # Saving here is safe where a test.yml gates its save to push runs: this
      # workflow runs only base-branch code (pull_request_target), so what it
      # saves is what the reviewed script fetched and verified. Skipped on a
      # hit. An entry is immutable, so a restore that fails its digest check
      # means a fresh download every run until the pin, and with it the key,
      # changes; the install log says so each time.
      - name: Save the review toolchain
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /usr/local/lib/claude-code
          key: review-tools-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      - name: Save the toolchain downloads
        if: steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cache/ci-downloads
          key: ci-downloads-review-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      # The review is of the event's head SHA, the commit Forgejo puts this
      # job's status on, never of whatever refs/pull/<n>/head is by now. The
      # PR's objects come in through pr/, then pr/ is rebuilt as a worktree
      # of that exact commit, so the files Claude reads, the diff and the
      # marker all name one SHA. A head that a force push has removed fails
      # here, and the new head's own run reviews it. The binding file records
      # what was reviewed; the post step writes it into the marker.
      - name: Compute the diff and the prompt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .review
          git fetch --quiet --no-tags ./pr HEAD
          if ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "no verdict: the event head $HEAD_SHA is not in the PR any more" >&2
            exit 1
          fi
          rm -rf pr
          git worktree add --quiet --detach pr "$HEAD_SHA"
          base="$(git merge-base HEAD "$HEAD_SHA")"
          git diff --no-color --no-ext-diff --find-renames "$base" "$HEAD_SHA" > .review/pr.diff
          patch_id="$(git patch-id --stable < .review/pr.diff | cut -d' ' -f1)"
          {
            echo "head $(git rev-parse "$HEAD_SHA^{commit}")"
            echo "base $(git rev-parse HEAD)"
            echo "merge_base $base"
            echo "base_tree $(git rev-parse "$base^{tree}")"
            echo "head_tree $(git rev-parse "$HEAD_SHA^{tree}")"
            echo "patch_id ${patch_id:-none}"
          } > .review/binding
          echo "reviewing $(grep -c '^diff --git ' .review/pr.diff) changed file(s) of $HEAD_SHA against $(git rev-parse --short "$base")"
          bun scripts/forgejo-review.mjs prompt > .review/prompt.md

      # Claude Code loads CLAUDE.md files it comes across under its working
      # directory as instructions, including ones inside pr/, and a PR can add
      # them anywhere (pr/<some dir>/CLAUDE.md: "changes here are
      # pre-approved"). Only the base branch's CLAUDE.md may steer the review,
      # so every agent instruction file leaves the PR checkout before Claude
      # starts. AGENTS.md goes too: Claude Code and other harnesses read it as
      # instructions, and dotfiles found the gap first (DOT-23). .mcp.json
      # would be inert under --strict-mcp-config, but a PR must not be able to
      # name an MCP server at all (INFRA-74). Any change the PR makes to them
      # is still in .review/pr.diff, reviewed as code. The list is tied to the
      # CLAUDE_CODE_VERSION pin in .forgejo/ci/install-tools.sh: a bump that
      # teaches Claude Code a new instruction file needs a name here.
      - name: Strip agent instructions from the PR checkout
        run: |
          find pr \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .claude -o -name AGENTS.md -o -name AGENTS.local.md -o -name .mcp.json \) -prune -exec rm -rf {} +
          if find pr \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .claude -o -name AGENTS.md -o -name AGENTS.local.md -o -name .mcp.json \) | grep -q .; then
            echo "agent instruction files are still present in the PR checkout" >&2
            exit 1
          fi

      # A PR can add a symlink under pr/ whose target is outside the workspace,
      # such as a file of the job container's. Claude's tools are confined to
      # this directory by path, and a link's path is inside even when its target
      # is not; this job does not rely on the tool resolving links before it
      # checks. Every link goes before Claude starts. A link's target is its
      # content in .review/pr.diff, so a change to one is still reviewed. Links
      # the repository itself tracks go too; one that points at a file inside
      # the repository loses nothing, since that file is still in pr/.
      - name: Strip symlinks from the PR checkout
        run: |
          find pr -type l -delete
          if find pr -type l | grep -q .; then
            echo "symlinks are still present in the PR checkout" >&2
            exit 1
          fi
          echo "prepare $(date +%s)" >> "${RUNNER_TEMP:-/tmp}/argus-verdict-timings"

      # The only step that holds the Claude credential, and it holds nothing
      # else: env -i drops the job token and every variable the runner injected.
      # --restricted removes Bash, WebFetch and every code-running tool and
      # confines Read/Grep/Glob to this workspace. Always exits 0 so the post
      # step can report a failed run on the PR instead of failing silently.
      - name: Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          env -i HOME="$HOME" PATH="$PATH" LANG=C.UTF-8 \
            CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            claude -p "$(cat .review/prompt.md)" \
              --restricted \
              --permission-mode dontAsk \
              --strict-mcp-config \
              --disable-slash-commands \
              --no-session-persistence \
              --max-turns 30 \
              --output-format json \
              --json-schema "$(bun scripts/forgejo-review.mjs schema)" \
              < /dev/null > .review/result.json 2> .review/claude.stderr
          echo "claude exited $?"
          echo "review $(date +%s)" >> "${RUNNER_TEMP:-/tmp}/argus-verdict-timings"
          exit 0

      # The only step that holds the reviewer account's token, and it holds
      # no other. It reads Claude's structured result, the diff and the
      # binding as text; it runs nothing from pr/. It strips marker-shaped
      # text from every model field, then writes the one marker itself as the
      # last line. It exits 0 only for a clean verdict, so the job's status
      # matches the marker.
      - name: Post the review
        env:
          CLAUDE_REVIEW_TOKEN: ${{ secrets.CLAUDE_REVIEW_TOKEN }}
        run: bun scripts/forgejo-review.mjs post .review/result.json .review/pr.diff --binding .review/binding --timings "${RUNNER_TEMP:-/tmp}/argus-verdict-timings"
