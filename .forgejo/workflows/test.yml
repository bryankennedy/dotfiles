name: test

# `bun test tests/`: the invariants that hold the Claude review's security
# properties in place, their canaries, and the review script's unit tests. No
# secrets and no network beyond installing bun. See docs/claude-review.md.

on:
  push:
    branches: [main]
  # Runs the PR's own code, unlike claude-review.yml. Kept on purpose: a PR
  # runs its own copy of this file, so removing the trigger here would stop
  # nothing. Why, and where it is assessed: docs/decisions/DOT-21.md.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    # The same image as the review job, so the runner pulls one image, not two.
    container:
      image: node:22-trixie@sha256:072889700aecef94c5cee46c6e60107cc2aaad9aa9e418ce05abaa1e85752ee3
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag: a tag on the actions mirror can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing later in this job talks to the forge, so leave no token in
          # .git/config for a test to find.
          persist-credentials: false

      # bun's release zip from the runner cache when it is there: GitHub's
      # release CDN serves the runner at ~1 MB/s. install-tools.sh's fetch()
      # checks a restored zip against BUN_SHA256 exactly as it checks a
      # download, and saving is for main's runs only (INFRA-193).
      - name: Restore the bun download
        id: bun-download
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cache/ci-downloads
          key: ci-downloads-bun-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      - name: Install the pinned toolchain
        run: sh .forgejo/ci/install-tools.sh test

      - name: Save the bun download
        if: github.event_name != 'pull_request' && steps.bun-download.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /root/.cache/ci-downloads
          key: ci-downloads-bun-${{ hashFiles('.forgejo/ci/install-tools.sh') }}

      - name: Tests
        run: bun test tests/
